name: Sync Champions seasons

on:
  schedule:
    # UTC 02:37 / 14:37 = 日本時間11:37 / 23:37。毎時0分やゲーム内切替時刻を避ける。
    - cron: '37 2,14 * * *'
  workflow_dispatch:
    inputs:
      resume_after_block:
        description: '403や形式変更の原因を解消した後、自動取得の停止を解除する'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: champions-season-sync
  cancel-in-progress: false

jobs:
  sync:
    # フォーク先で同じPBDB定期取得を意図せず増やさない。
    if: github.repository == 'suisui-swimmy/PokeLinker'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test without network access
        run: node --test tests/*.test.cjs
      - name: Read the last published data and access state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/season-feed"
          git ls-remote --heads origin season-data > "$RUNNER_TEMP/season-ref"
          if [ -s "$RUNNER_TEMP/season-ref" ]; then
            git fetch --depth=1 origin season-data
            git show FETCH_HEAD:champions-seasons.json > "$RUNNER_TEMP/season-feed/champions-seasons.json"
            git show FETCH_HEAD:fetch-state.json > "$RUNNER_TEMP/season-feed/fetch-state.json"
            echo "FEED_PARENT=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"
          fi
      - name: Fetch only the season list once
        id: sync
        continue-on-error: true
        env:
          RESUME_AFTER_BLOCK: ${{ inputs.resume_after_block }}
        run: node scripts/sync-seasons.cjs "$RUNNER_TEMP/season-feed"
      - name: Publish data and retain cooldown even after a failed fetch
        if: ${{ !cancelled() && (steps.sync.outcome == 'success' || steps.sync.outcome == 'failure') }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/season-feed/champions-seasons.json"
          test -f "$RUNNER_TEMP/season-feed/fetch-state.json"
          if [ -n "${FEED_PARENT:-}" ]; then
            git switch --detach "$FEED_PARENT"
          else
            git switch --orphan season-data
          fi
          cp "$RUNNER_TEMP/season-feed/"*.json .
          git add champions-seasons.json fetch-state.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: refresh Champions season data and fetch state'
            git push origin HEAD:refs/heads/season-data
          fi
      - name: Report an unsuccessful fetch
        if: steps.sync.outcome == 'failure'
        run: exit 1
